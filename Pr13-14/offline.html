<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Офлайн</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #f3f6fb;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 26%),
          linear-gradient(135deg, #0a0c10 0%, #0f1217 48%, #0a0d12 100%);
      }

      main {
        width: min(560px, calc(100% - 24px));
        padding: 28px;
        border: 1px solid #2a313c;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 46%), #171b22;
        box-shadow: 0 26px 64px rgba(0, 0, 0, 0.42);
      }

      p:first-of-type {
        margin: 0 0 10px;
        color: #4cc2ff;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        line-height: 1.05;
      }

      p:last-of-type {
        margin: 0;
        color: #96a3b5;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Offline mode</p>
      <h1>Приложение открыто без сети</h1>
      <p>Основные файлы уже сохранены локально. Вернитесь на главную страницу, чтобы продолжить работу с заметками даже без подключения к интернету.</p>
    </main>
  </body>
</html>
