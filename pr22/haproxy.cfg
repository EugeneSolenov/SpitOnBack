global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 2s
  timeout client 30s
  timeout server 30s

frontend http_front
  bind *:80
  http-response set-header X-Balancer HAProxy
  default_backend http_back

backend http_back
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  default-server inter 2s fall 2 rise 2
  server backend1 backend1:3000 check
  server backend2 backend2:3000 check
  server backend3 backend3:3000 check backup

listen stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
