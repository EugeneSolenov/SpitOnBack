<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Flow офлайн</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(105, 226, 194, 0.12), transparent 22%),
          radial-gradient(circle at top right, rgba(94, 135, 255, 0.18), transparent 24%),
          linear-gradient(180deg, #09111f 0%, #0b1324 100%);
        color: #f4f7fb;
      }

      .offline-card {
        width: min(560px, calc(100% - 24px));
        padding: 28px;
        border: 1px solid rgba(132, 156, 214, 0.2);
        border-radius: 28px;
        background: rgba(12, 17, 29, 0.92);
        box-shadow: 0 28px 80px rgba(3, 7, 18, 0.38);
      }

      p:first-child {
        margin: 0 0 10px;
        color: #69e2c2;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 5vw, 2.8rem);
        line-height: 1.05;
      }

      p:last-child {
        margin: 0;
        color: #b7c4e1;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <p>Offline mode</p>
      <h1>Каркас приложения загружен локально</h1>
      <p>
        Основные файлы уже находятся в кэше. Как только соединение вернётся, можно
        будет снова получать обновления в реальном времени и push-уведомления.
      </p>
    </main>
  </body>
</html>
