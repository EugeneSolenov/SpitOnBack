<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Приложение для заметок." />
    <meta name="theme-color" content="#17171a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Заметки" />
    <title>Заметки</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar__brand">
          <div class="sidebar__title">Заметки</div>
        </div>

        <nav class="sidebar__nav" aria-label="Навигация по приложению">
          <button id="home-btn" class="sidebar__nav-button active" type="button">Главная</button>
          <button id="about-btn" class="sidebar__nav-button" type="button">О приложении</button>
        </nav>

        <section class="sidebar-notes" aria-labelledby="notes-title">
          <div class="sidebar-notes__header">
            <h2 id="notes-title">Мои заметки</h2>
            <p id="notes-meta">0 заметок</p>
          </div>

          <div id="notes-grid" class="notes-list"></div>
        </section>

        <div class="sidebar__footer">
          <button id="enable-push" class="button button--primary" type="button">Включить уведомления</button>
          <button id="disable-push" class="button button--secondary" type="button" hidden>
            Отключить уведомления
          </button>
        </div>
      </aside>

      <div class="workspace">
        <header class="main-header">
          <div class="searchbar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6" />
              <path d="M20 20l-4.2-4.2" />
            </svg>
            <input id="search-input" type="search" placeholder="Поиск заметок" autocomplete="off" />
          </div>
        </header>

        <main id="app-content" class="content" aria-live="polite">
          <section class="quick-note quick-note--loading">
            <div class="loading-line"></div>
            <div class="loading-line loading-line--wide"></div>
            <div class="loading-block"></div>
          </section>
        </main>
      </div>
    </div>

    <div class="fab-stack" aria-label="Быстрые действия">
      <button id="note-fab" class="fab" type="button" aria-label="Создать текстовую заметку">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20l4.5-1l9.8-9.8l-3.5-3.5L5 15.5z" />
          <path d="M13.5 6.5l3.5 3.5" />
        </svg>
      </button>
    </div>

    <div id="toast-stack" class="toast-stack" aria-live="assertive" aria-atomic="true"></div>

    <template id="note-card-template">
      <article class="note-card" tabindex="0">
        <h3 class="note-card__title"></h3>
        <p class="note-card__meta"></p>
      </article>
    </template>

    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
